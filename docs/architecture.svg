<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 492" role="img">
  <title>Breaker 연동 구성도</title>
  <desc>서비스 회사의 헬프데스크 앱과 AI 에이전트, Trifecta Breaker 서비스, 회사 DB, Breaker DB의 소유 관계와 연결을 보여주는 구성도.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;}
    .t{font-size:14px;font-weight:600;}
    .ts{font-size:11.5px;}
    .lbl{font-size:12px;}
    .title{font-size:16px;font-weight:600;}
  </style>

  <rect x="0" y="0" width="680" height="492" fill="#ffffff"/>
  <text x="30" y="26" class="title" fill="#2C2C2A">구성도 — Breaker 연동 (ON)</text>

  <!-- zones -->
  <rect x="22" y="120" width="218" height="216" rx="12" fill="none" stroke="#378ADD" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="32" y="138" class="lbl" fill="#185FA5">서비스 회사</text>
  <rect x="444" y="180" width="212" height="216" rx="12" fill="none" stroke="#7F77DD" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="454" y="198" class="lbl" fill="#534AB7">Trifecta Breaker</text>

  <!-- legend -->
  <rect x="470" y="46" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="490" y="57" class="ts" fill="#2C2C2A">서비스 회사 소유</text>
  <rect x="470" y="70" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="490" y="81" class="ts" fill="#2C2C2A">Trifecta Breaker 소유</text>
  <rect x="470" y="94" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780"/>
  <text x="490" y="105" class="ts" fill="#2C2C2A">외부 사용자</text>

  <!-- arrows (drawn under boxes) -->
  <path d="M118,88 L118,150" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M215,206 L305,400" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M220,290 L460,348" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M490,376 L490,429 L452,429" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M552,320 L552,259" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="124" y="118" class="lbl" fill="#5F5E5A">① 티켓 제출</text>
  <text x="150" y="376" class="lbl" fill="#5F5E5A">② 티켓 읽기/쓰기</text>
  <text x="320" y="306" class="lbl" fill="#5F5E5A" text-anchor="middle">③ SQL 요청 (/execute)</text>
  <text x="500" y="414" class="lbl" fill="#5F5E5A">④ 허용된 SQL만 실행</text>
  <text x="560" y="294" class="lbl" fill="#5F5E5A">⑤ stamp 기록</text>

  <!-- 고객 -->
  <rect x="40" y="40" width="150" height="48" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="115" y="62" class="t" fill="#2C2C2A" text-anchor="middle">고객 / 공격자</text>
  <text x="115" y="79" class="ts" fill="#5F5E5A" text-anchor="middle">외부 사용자</text>

  <!-- Helpdesk -->
  <rect x="40" y="150" width="180" height="56" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="130" y="178" class="t" fill="#0C447C" text-anchor="middle">Helpdesk 앱</text>
  <text x="130" y="195" class="ts" fill="#185FA5" text-anchor="middle">Next.js · 티켓 폼·조회</text>

  <!-- AI agent -->
  <rect x="40" y="262" width="180" height="56" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="130" y="290" class="t" fill="#0C447C" text-anchor="middle">AI 에이전트</text>
  <text x="130" y="307" class="ts" fill="#185FA5" text-anchor="middle">execute_sql 도구</text>

  <!-- Breaker DB -->
  <rect x="460" y="205" width="185" height="52" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="552" y="231" class="t" fill="#3C3489" text-anchor="middle">Breaker DB</text>
  <text x="552" y="248" class="ts" fill="#534AB7" text-anchor="middle">세션·판정 기록</text>

  <!-- Breaker service -->
  <rect x="460" y="320" width="185" height="56" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="552" y="346" class="t" fill="#3C3489" text-anchor="middle">Breaker 서비스</text>
  <text x="552" y="363" class="ts" fill="#534AB7" text-anchor="middle">Vercel · 검문소(프록시)</text>

  <!-- Company DB -->
  <rect x="250" y="400" width="200" height="58" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <text x="350" y="428" class="t" fill="#0C447C" text-anchor="middle">회사 DB</text>
  <text x="350" y="445" class="ts" fill="#185FA5" text-anchor="middle">Supabase · 회사 소유</text>

  <text x="350" y="478" class="ts" fill="#5F5E5A" text-anchor="middle">Breaker는 이 DB를 소유·복제하지 않고 연결만 합니다</text>
</svg>
